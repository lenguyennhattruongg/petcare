{% extends "layouts/base.html" %}

{% block title %}Đặt Lịch Hẹn Khám - PetCare{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <div>
                    <span class="badge bg-primary-subtle text-primary mb-1">Thành viên 2 phụ trách</span>
                    <h3 class="fw-bold text-primary mb-0">Đặt Lịch Khám Trực Tuyến</h3>
                </div>
                <i class="bi bi-calendar-check text-primary fs-1"></i>
            </div>

            <form method="POST" action="{{ url_for('client.booking') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tên bé cưng <span class="text-danger">*</span></label>
                        <input type="text" name="pet_name" class="form-control" placeholder="Ví dụ: Bé Miu, Cún Lu" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Loài thú cưng</label>
                        <select name="species" class="form-select">
                            <option value="dog">Chó</option>
                            <option value="cat">Mèo</option>
                            <option value="other">Khác (Thỏ, Chuột Hamster, Chim...)</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Dịch vụ yêu cầu <span class="text-danger">*</span></label>
                        <select name="service_id" class="form-select" required>
                            <option value="1">Khám tổng quát (150.000₫)</option>
                            <option value="2">Tiêm phòng Vắc-xin (250.000₫)</option>
                            <option value="3">Spa & Cắt tỉa (300.000₫)</option>
                            <option value="4">Phẫu thuật / Triệt sản (800.000₫)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Bác sĩ phụ trách (Tùy chọn)</label>
                        <select name="doctor_id" class="form-select">
                            <option value="">Bác sĩ bất kỳ (Hệ thống tự xếp)</option>
                            <option value="1">BS. CK1 Nguyễn Hoàng Nam</option>
                            <option value="2">ThS. BS Trần Phương Thảo</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Ngày hẹn khám <span class="text-danger">*</span></label>
                        <input type="date" name="appointment_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Khung giờ hẹn <span class="text-danger">*</span></label>
                        <select name="time_slot" class="form-select" required>
                            <option value="08:00">08:00 - 08:30</option>
                            <option value="08:30">08:30 - 09:00</option>
                            <option value="09:00">09:00 - 09:30</option>
                            <option value="09:30">09:30 - 10:00</option>
                            <option value="10:00">10:00 - 10:30</option>
                            <option value="14:00">14:00 - 14:30</option>
                            <option value="14:30">14:30 - 15:00</option>
                            <option value="15:00">15:00 - 15:30</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Mô tả triệu chứng hoặc ghi chú cho bác sĩ</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="Bé bỏ ăn 2 ngày nay, mệt mỏi, ho khan..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('client.home') }}" class="btn btn-light px-4">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i> Xác Nhận Đặt Lịch
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
