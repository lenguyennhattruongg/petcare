{% extends "layouts/base.html" %}

{% block title %}Đăng Ký - Hệ Thống PetCare{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="badge bg-primary-subtle text-primary mb-2">Thành viên 1 phụ trách</div>
                <h3 class="fw-bold text-primary">Tạo Tài Khoản</h3>
                <p class="text-muted small">Đăng ký để quản lý thú cưng và đặt lịch khám tiện lợi</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Họ và tên</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Số điện thoại</label>
                        <input type="tel" name="phone" class="form-control" placeholder="0901234567" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="example@email.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" placeholder="Ít nhất 8 ký tự, gồm số và ký tự đặc biệt" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                    <i class="bi bi-person-plus me-1"></i> Đăng Ký Tài Khoản
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small mb-0">Đã có tài khoản? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Đăng nhập</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
