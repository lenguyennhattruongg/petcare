{% extends "layouts/base.html" %}

{% block title %}Đăng Nhập - Hệ Thống PetCare{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="badge bg-primary-subtle text-primary mb-2">Thành viên 1 phụ trách</div>
                <h3 class="fw-bold text-primary">Đăng Nhập</h3>
                <p class="text-muted small">Truy cập cổng thông tin Bệnh viện Thú y PetCare</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên đăng nhập hoặc Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control border-start-0" placeholder="admin / doctor / khachhang" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label fw-semibold">Mật khẩu</label>
                        <a href="#" class="small text-decoration-none">Quên mật khẩu?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label small" for="remember">Ghi nhớ đăng nhập</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small mb-0">Chưa có tài khoản? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
